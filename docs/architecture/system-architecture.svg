<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e6fba"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
  </defs>

  <rect width="980" height="640" fill="#f7f8fa"/>

  <!-- Title -->
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f3a5f">System Architecture</text>

  <!-- Customer browser -->
  <rect x="40" y="60" width="180" height="56" rx="8" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
  <text x="130" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#1f3a5f">Customer / Visitor</text>
  <text x="130" y="101" text-anchor="middle" font-size="11" fill="#5a6472">browser, no auth</text>

  <!-- Agent browser -->
  <rect x="760" y="60" width="180" height="56" rx="8" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
  <text x="850" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#1f3a5f">Agent</text>
  <text x="850" y="101" text-anchor="middle" font-size="11" fill="#5a6472">browser, Sanctum token</text>

  <!-- React -->
  <rect x="330" y="150" width="320" height="70" rx="8" fill="#eaf1fb" stroke="#2e6fba" stroke-width="1.5"/>
  <text x="490" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a5f">React (Vite) — port 5173</text>
  <text x="490" y="195" text-anchor="middle" font-size="11" fill="#2e6fba">Chat widget (public) + Agent dashboard</text>
  <text x="490" y="210" text-anchor="middle" font-size="10" fill="#5a6472">Talks only to Laravel</text>

  <!-- Laravel -->
  <rect x="330" y="280" width="320" height="90" rx="8" fill="#1f3a5f"/>
  <text x="490" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Laravel API — port 8000</text>
  <text x="490" y="328" text-anchor="middle" font-size="11" fill="#cfe0f5">Auth (Sanctum), tickets, messages,</text>
  <text x="490" y="343" text-anchor="middle" font-size="11" fill="#cfe0f5">documents, queue jobs, orchestration</text>
  <text x="490" y="360" text-anchor="middle" font-size="10" fill="#9db6d8">Only caller of the FastAPI service</text>

  <!-- FastAPI -->
  <rect x="720" y="280" width="230" height="90" rx="8" fill="#ffffff" stroke="#2e6fba" stroke-width="1.5"/>
  <text x="835" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#1f3a5f">FastAPI — port 8001</text>
  <text x="835" y="322" text-anchor="middle" font-size="10.5" fill="#2e6fba">/chat /ingest</text>
  <text x="835" y="337" text-anchor="middle" font-size="10.5" fill="#2e6fba">/sentiment /summarize</text>
  <text x="835" y="354" text-anchor="middle" font-size="9.5" fill="#5a6472">RAG, embeddings, LLM calls</text>

  <!-- Redis -->
  <rect x="40" y="280" width="200" height="90" rx="8" fill="#ffffff" stroke="#b33a3a" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="140" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1f3a5f">Redis — port 6379</text>
  <text x="140" y="327" text-anchor="middle" font-size="10.5" fill="#5a6472">Queue: sentiment, ingest,</text>
  <text x="140" y="342" text-anchor="middle" font-size="10.5" fill="#5a6472">email-summary jobs</text>
  <text x="140" y="359" text-anchor="middle" font-size="9" fill="#8a94a3">(sync driver on free-tier deploys)</text>

  <!-- Postgres -->
  <rect x="230" y="430" width="520" height="100" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="490" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a5f">PostgreSQL + pgvector — port 5432</text>
  <text x="380" y="478" text-anchor="middle" font-size="11" fill="#2e8b57" font-weight="600">Laravel owns:</text>
  <text x="380" y="495" text-anchor="middle" font-size="10.5" fill="#5a6472">users, agents, tickets,</text>
  <text x="380" y="510" text-anchor="middle" font-size="10.5" fill="#5a6472">messages, documents</text>
  <line x1="490" y1="470" x2="490" y2="518" stroke="#e1e4e8"/>
  <text x="600" y="478" text-anchor="middle" font-size="11" fill="#2e8b57" font-weight="600">FastAPI owns:</text>
  <text x="600" y="495" text-anchor="middle" font-size="10.5" fill="#5a6472">document_chunks</text>
  <text x="600" y="510" text-anchor="middle" font-size="10.5" fill="#5a6472">(384-dim embeddings, HNSW)</text>

  <!-- LLM provider (external) -->
  <rect x="720" y="430" width="230" height="70" rx="8" fill="#ffffff" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="835" y="454" text-anchor="middle" font-size="12" font-weight="700" fill="#5a6472">LLM Provider</text>
  <text x="835" y="472" text-anchor="middle" font-size="10" fill="#8a94a3">OpenAI · Anthropic · Groq</text>
  <text x="835" y="487" text-anchor="middle" font-size="9" fill="#8a94a3">selected via LLM_PROVIDER</text>

  <!-- IMAP inbox (external) -->
  <rect x="40" y="430" width="180" height="70" rx="8" fill="#ffffff" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="130" y="454" text-anchor="middle" font-size="12" font-weight="700" fill="#5a6472">Support Inbox</text>
  <text x="130" y="472" text-anchor="middle" font-size="10" fill="#8a94a3">IMAP, polled every 5 min</text>
  <text x="130" y="487" text-anchor="middle" font-size="9" fill="#8a94a3">email:poll command</text>

  <!-- Arrows -->
  <!-- customer -> react -->
  <path d="M130,116 L130,140 L400,140 L400,150" fill="none" stroke="#2e6fba" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- agent -> react -->
  <path d="M850,116 L850,140 L580,140 L580,150" fill="none" stroke="#2e6fba" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- react -> laravel -->
  <path d="M490,220 L490,280" fill="none" stroke="#2e6fba" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="503" y="253" font-size="9.5" fill="#5a6472">HTTP (Bearer token)</text>

  <!-- laravel -> fastapi -->
  <path d="M650,315 L720,315" fill="none" stroke="#2e6fba" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="308" font-size="9" fill="#5a6472">X-Internal-Api-Key</text>

  <!-- laravel -> redis -->
  <path d="M330,325 L240,325" fill="none" stroke="#b33a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- laravel -> postgres -->
  <path d="M450,370 L450,430" fill="none" stroke="#2e8b57" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- fastapi -> postgres -->
  <path d="M820,370 L650,430" fill="none" stroke="#2e8b57" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- fastapi -> llm -->
  <path d="M835,370 L835,430" fill="none" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

  <!-- imap -> laravel -->
  <path d="M140,430 L140,410 L330,410 L330,348" fill="none" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

  <!-- Legend -->
  <g font-size="10" fill="#5a6472">
    <line x1="40" y1="600" x2="65" y2="600" stroke="#2e6fba" stroke-width="2"/>
    <text x="72" y="604">Synchronous HTTP call</text>
    <line x1="230" y1="600" x2="255" y2="600" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="262" y="604">External service</text>
    <line x1="410" y1="600" x2="435" y2="600" stroke="#b33a3a" stroke-width="1.5"/>
    <text x="442" y="604">Queue dispatch</text>
  </g>
</svg>
